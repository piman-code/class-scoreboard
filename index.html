<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>학급 단합대회 전광판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <div class="tabs" role="tablist">
    <button role="tab" id="tab-board" data-view="board" aria-selected="true">전광판</button>
    <button role="tab" id="tab-roster" data-view="roster" aria-selected="false">팀 명단</button>
    <button role="tab" id="tab-admin" data-view="admin" aria-selected="false">점수 입력</button>
  </div>
  <div class="sync"><span class="dot" id="syncdot"></span><span id="synctext">연결 중…</span>
    <button class="ghost" id="fs">전체 화면</button></div>
</div>

<main id="board" role="tabpanel" aria-labelledby="tab-board">
  <div class="hero">
    <div><h1 id="b-title">학급 단합대회</h1><div class="sub">좀비게임 · 꼬리잡기 · 피구</div></div>
    <div class="clock paused" id="b-clock"><div class="label" id="b-clocklabel"></div><div class="time" id="b-time">08:00</div></div>
  </div>
  <div class="ranks" id="b-ranks"></div>
  <div class="progress" id="b-progress"></div>
  <div class="keys" id="b-keys"><kbd>Space</kbd> 타이머 시작·정지 · <kbd>R</kbd> 타이머 처음으로 · <kbd>I</kbd> 점수 입력 · <kbd>B</kbd> 전광판 · <kbd>F</kbd> 전체 화면</div>
</main>

<main id="roster" role="tabpanel" aria-labelledby="tab-roster" hidden></main>

<main id="admin" role="tabpanel" aria-labelledby="tab-admin" hidden></main>

<script type="module" src="app.js"></script>
</body>
</html>
